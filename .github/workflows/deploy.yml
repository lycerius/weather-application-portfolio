name: Deploy Weather Application

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run: deploy or destroy"
        required: true
        default: "deploy"

permissions:
  id-token: write
  contents: read

jobs:
  # Resolves the release tag for this run: the pushed tag, or a new patch tag for pushes to main.
  # Tags pushed with GITHUB_TOKEN don't trigger another run, so the main-push run deploys itself.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            exit 0
          fi

          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # Reuse a tag already on this commit so re-runs don't bump the version again
          existing=$(git tag --points-at HEAD --sort=-v:refname | grep -E "$semver" | head -n1 || true)
          if [[ -n "$existing" ]]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E "$semver" | head -n1 || true)
          if [[ -z "$latest" ]]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  build-pulumi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore and publish Pulumi infra
        run: dotnet publish -c Release -o ./bin/publish

      - name: Upload Pulumi infra artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-publish
          path: bin/publish

  build-weather-api:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy') }}
    needs:
      - version
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595266861432:role/GithubWorkerRole
          aws-region: us-east-1

      - name: Require 1.0.0 for first image
        if: ${{ needs.version.outputs.tag != '' }}
        run: |
          image_count=$(aws ecr describe-images \
            --repository-name weather-api \
            --query 'length(imageDetails[])' \
            --output text)
          if [[ "$image_count" == "0" && "$RELEASE_TAG" != "v1.0.0" ]]; then
            echo "The first image must use Git tag v1.0.0; received $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/weather-api
          # ECR tags are immutable; push only the version tag, never latest
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}

      - name: Build and push weather-api image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: weather-api
          push: ${{ needs.version.outputs.tag != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy by digest so the running task always matches exactly what was built here
      - name: Output immutable image reference
        id: image
        if: ${{ needs.version.outputs.tag != '' }}
        run: echo "image=${{ steps.ecr.outputs.registry }}/weather-api:${RELEASE_TAG#v}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-web-pulumi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore and publish web Pulumi infra
        run: dotnet publish -c Release -o ./bin/publish

      - name: Upload web Pulumi infra artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-infra-publish
          path: bin/publish

  build-weather-web:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weather-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: weather-web
        run: npm ci

      - name: Build frontend for production
        working-directory: weather-web
        run: npm run build

      - name: Upload frontend bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-web-dist
          path: weather-web/dist

  deploy:
    # Deploy only when a release tag was resolved (tag pushes and main pushes); PRs only build.
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')) && needs.version.outputs.tag != '' }}
    needs:
      - version
      - build-pulumi
      - build-web-pulumi
      - build-weather-api
      - build-weather-web
    outputs:
      api_url: ${{ steps.api-url.outputs.api_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595266861432:role/GithubWorkerRole
          aws-region: us-east-1

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Pulumi Login
        run: pulumi login s3://pulimi-state-595266861432-us-east-1-an/weather-infra/

      - name: Pulumi Stack Select
        run: pulumi stack select dev

      - name: Set image to deploy
        run: pulumi config set image "${{ needs.build-weather-api.outputs.image }}"

      - name: Pulumi Preview
        run: pulumi preview --diff

      - name: Pulumi Up
        run: pulumi up --yes --show-replacement-steps

      - name: Capture API LB URL
        id: api-url
        run: echo "api_url=$(pulumi stack output url)" >> "$GITHUB_OUTPUT"

  deploy-web:
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')) && needs.version.outputs.tag != '' }}
    needs:
      - version
      - deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-web
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      VITE_API_URL: ${{ needs.deploy.outputs.api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weather-web/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595266861432:role/GithubWorkerRole
          aws-region: us-east-1

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      # Same backend as the API stack so the web stack's StackReference can resolve it
      - name: Pulumi Login
        run: pulumi login s3://pulimi-state-595266861432-us-east-1-an/weather-infra/

      - name: Pulumi Stack Select
        run: pulumi stack select dev --create

      - name: Build frontend with API URL
        working-directory: weather-web
        run: |
          npm ci
          npm run build

      # Create the bucket before syncing to it
      - name: Pulumi Up
        run: pulumi up --yes --show-replacement-steps

      - name: Deploy frontend bundle to S3
        run: |
          BUCKET=$(pulumi stack output bucketName)
          aws s3 sync ../weather-web/dist "s3://$BUCKET" --delete

  pulumi-destroy-web:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    needs:
      - build-web-pulumi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-web
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595266861432:role/GithubWorkerRole
          aws-region: us-east-1

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Pulumi Login
        run: pulumi login s3://pulimi-state-595266861432-us-east-1-an/weather-infra/

      - name: Pulumi Stack Select
        run: pulumi stack select dev

      - name: Pulumi Destroy (manual)
        run: pulumi destroy --yes

  pulumi-destroy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    # The web stack references the API stack's outputs, so tear it down first
    needs:
      - build-pulumi
      - pulumi-destroy-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595266861432:role/GithubWorkerRole
          aws-region: us-east-1

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Pulumi Login
        run: pulumi login s3://pulimi-state-595266861432-us-east-1-an/weather-infra/

      - name: Pulumi Stack Select
        run: pulumi stack select dev

      - name: Pulumi Destroy (manual)
        run: pulumi destroy --yes
